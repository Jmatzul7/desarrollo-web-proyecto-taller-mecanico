<div class="inicio-sesion-pagina">
  <div class="inicio-sesion-tarjeta">
    <div class="inicio-sesion-izquierda">
     <!--  <a class="flecha-volver" routerLink="/" aria-label="Volver">←</a> -->

      <div class="inicio-sesion-izquierda-contenido">
        <div class="marca">
          <span class="marca-punto"></span>
          Taller Mecánico
        </div>

        <h1>Iniciar sesión en el sistema</h1>

        <!-- desactivado -->
         <!---
        <p class="inicio-sesion-subtitulo">
          Ingresa tus datos de acceso o
          <a routerLink="/registro">haz clic aquí</a>
          para registrarte
        </p>-->

        <form [formGroup]="formulario" (ngSubmit)="enviar()" class="inicio-sesion-formulario">
          <div class="campo-subrayado">
            <label for="nombreUsuario">Usuario</label>
            <input
              id="nombreUsuario"
              type="text"
              formControlName="nombreUsuario"
              autocomplete="username"
              placeholder="tu.usuario"
            />
          </div>
          @if (nombreUsuario.touched && nombreUsuario.invalid) {
            <span class="error-campo">El usuario es obligatorio.</span>
          }

          <div class="campo-subrayado">
            <label for="password">Contraseña</label>
            <input
              id="password"
              type="password"
              formControlName="password"
              autocomplete="current-password"
              placeholder="••••••••"
            />
          </div>
          @if (password.touched && password.invalid) {
            <span class="error-campo">La contraseña es obligatoria.</span>
          }

          <!--
          <div class="inicio-sesion-fila">
            <label class="recordarme">
              <input type="checkbox" formControlName="recordar" />
              Recordarme
            </label>
          </div> -->

          @if (mensajeError()) {
            <div class="inicio-sesion-error">{{ mensajeError() }}</div>
          }

          <app-boton tipo="submit" [cargando]="cargando()" class="inicio-sesion-enviar">
            Ingresar
          </app-boton>
        </form>
      </div>
    </div>

    <div class="inicio-sesion-derecha">
      <div class="onda-grafico">
        <svg viewBox="0 0 400 600" preserveAspectRatio="none" class="onda-svg">
          <path d="M0,120 C120,40 220,220 400,90 L400,0 L0,0 Z" fill="rgba(139,92,246,0.55)"></path>
          <path d="M0,260 C140,180 260,340 400,230 L400,600 L0,600 Z" fill="rgba(59,130,246,0.45)"></path>
          <path d="M0,360 C160,300 240,460 400,360 L400,600 L0,600 Z" fill="rgba(236,72,153,0.5)"></path>
        </svg>
        <div class="onda-glow resplandor-a"></div>
        <div class="onda-glow resplandor-b"></div>
      </div>
    </div>
  </div>
</div>
